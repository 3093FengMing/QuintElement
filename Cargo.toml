[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/demo",
    "crates/driver",
    "crates/elemental",
    "crates/infra",
    "crates/launcher",
    "crates/object",
    "crates/schema",
    "crates/shared",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/ElectronicWave/Elemental"
homepage = "https://github.com/ElectronicWave/Elemental"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = { version = "1.0.104" }
async-trait = "0.1.92"
dirs = { version = "7.0.0" }
futures = "0.3.34"
hex = "0.4.3"
jiff = { version = "0.2.39", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "system-proxy"] }
scc = { version = "3.8.8", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt",
    "macros",
    "fs",
    "io-util",
    "rt-multi-thread",
    "process",
    "sync",
    "time",
] }
toml = "1.2.1"
