[package]
name = "elemental-infra"
documentation = "https://docs.rs/elemental-infra"
description = "Infrastructure library for Elemental, providing some infra objects such as downloaders, file utilities, and other common tools used across the project."

version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
scc = { workspace = true }
serde = { workspace = true, optional = true }
sha1 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7.17", default-features = false, features = ["rt"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
